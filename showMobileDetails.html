<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Details</title>
</head>
<body>
    <div id="op"></div>
    <script>
        window.addEventListener("load", () => {
            let s = 'UserAgent: '+navigator.userAgent + '\n' + 'Connection: \n Downlink:'+ navigator.connection.downlink + '\n effectiveType: ' + navigator.connection.effectiveType + '\n rtt: '+ navigator.connection.rtt;
            
            document.getElementById('op').innerText = s;

        });
    </script>
</body>
</html>
