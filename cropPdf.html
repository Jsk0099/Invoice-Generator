<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crop Header/Footer from PDF</title>
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <style>
        /* <button class="button-56" role="button">Button 56</button> */

        /* CSS */
        .button-56 {
        align-items: center;
        background-color: #fee6e3;
        border: 2px solid #111;
        border-radius: 8px;
        box-sizing: border-box;
        color: #111;
        cursor: pointer;
        display: flex;
        font-family: Inter,sans-serif;
        font-size: 16px;
        height: 48px;
        justify-content: center;
        line-height: 24px;
        max-width: 100%;
        padding: 0 25px;
        position: relative;
        text-align: center;
        text-decoration: none;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        }

        .button-56:after {
        background-color: #111;
        border-radius: 8px;
        content: "";
        display: block;
        height: 48px;
        left: 0;
        width: 100%;
        position: absolute;
        top: -2px;
        transform: translate(8px, 8px);
        transition: transform .2s ease-out;
        z-index: -1;
        }

        .button-56:hover:after {
        transform: translate(0, 0);
        }

        .button-56:active {
        background-color: #ffdeda;
        outline: 0;
        }

        .button-56:hover {
        outline: 0;
        }

        @media (min-width: 768px) {
        .button-56 {
            padding: 0 40px;
        }
        }
        #content{
            margin: auto;
            max-width: 500px;
        }
    </style>

    <style>
        html{
            height:100%;
        }

        body{
            
            background-color:#294362;
            height:100%;
        }

        .wrapper{
            width:100%;
            height:100%;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        
        .file-upload{
            height: 50%;
            width: 50%;
            border-radius: 100px;
            position:relative;
            
            display:flex;
            justify-content:center;
            align-items: center;  

            border:4px solid #FFFFFF;
            overflow:hidden;
            background-image: linear-gradient(to bottom, #2590EB 50%, #123757 50%);
            background-size: 100% 200%;
            transition: all 1s;
            color: #FFFFFF;
            font-size:100px;
        }

        input[type='file']{
            height:100%;
            width:100%;
            position:absolute;
            top:0;
            left:0;
            opacity:0;
            cursor:pointer;
        }

        .file-upload:hover{
            background-position: 0 -100%;
            color:#2590EB;
        }

        .file-upload span{
            font-size: 27px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="file-upload">
            <input type="file" id="pdfInput" accept="application/pdf" />
            <!-- <i class="fa fa-arrow-up"></i> -->
            <span> Upload and Download Your File </span>
        </div>
    </div>
 
  <script>
    const HEADER_HEIGHT = 52; // Adjust this value
    const FOOTER_HEIGHT = 43; // Adjust this value
 
    document.getElementById('pdfInput').onchange = async () => {
      const input = document.getElementById('pdfInput');
      if (!input.files.length) {
        alert("Please upload a PDF file.");
        return;
      }
 
      const file = input.files[0];
      const arrayBuffer = await file.arrayBuffer();
      const sourcePdf = await PDFLib.PDFDocument.load(arrayBuffer);
      const outputPdf = await PDFLib.PDFDocument.create();
 
      const totalPages = sourcePdf.getPageCount();
 
      for (let i = 0; i < totalPages; i++) {
        const srcPage = sourcePdf.getPage(i);
        const { width, height } = srcPage.getSize();
 
        const contentHeight = height - HEADER_HEIGHT - FOOTER_HEIGHT;
 
        const [croppedPage] = await outputPdf.copyPages(sourcePdf, [i]);
        croppedPage.setSize(width, contentHeight);
        croppedPage.setCropBox(0, FOOTER_HEIGHT, width, contentHeight);
 
        outputPdf.addPage(croppedPage);
      }
 
      const pdfBytes = await outputPdf.save();
 
      // Trigger download
      const blob = new Blob([pdfBytes], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'cropped_no_header_footer.pdf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };
  </script>
</body>
</html>
